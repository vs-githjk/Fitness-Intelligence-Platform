# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: fitness-intelligence-api-staging
    runtime: docker
    plan: starter
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 30
    envVars:
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: fitness-intelligence-db-staging
          property: connectionString
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: fitness-intelligence-db-staging
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: 60
      - key: CORS_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: DEMO_INVITE_CODE
        generateValue: true
      - key: COACH_REGISTRATION_CODE
        sync: false
      - key: DEMO_MODE_ENABLED
        sync: false
      - key: DEMO_SESSION_MINUTES
        value: 30
      - key: SEED_DEMO_DATA
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: API_DOCS_ENABLED
        value: false
      - key: DATABASE_SSLMODE
        value: require
      - key: DATABASE_POOL_SIZE
        value: 5
      - key: DATABASE_MAX_OVERFLOW
        value: 5
      - key: DATABASE_POOL_TIMEOUT
        value: 30
      - key: DATABASE_POOL_RECYCLE
        value: 1800
      - key: DATABASE_CONNECT_TIMEOUT
        value: 5
      - key: PYTHONUNBUFFERED
        value: 1

  # ── Production ────────────────────────────────────────────────────────────
  # A fully distinct service + database from staging: its own DB, secrets, media
  # bucket, email delivery, and origin. Nothing is shared with staging. Every value
  # that encodes the (not-yet-decided) production domain or a secret is `sync: false`
  # and must be set in the Render dashboard at launch — this file never invents the
  # domain/TLD or embeds a secret. Deploys are deliberate (manual), not on push.
  #
  # Deploy prerequisites (founder/external inputs — see docs/production-readiness.md):
  #   a `production` branch, the production hostname, a media bucket + S3/R2 keys,
  #   an SMTP provider, and the legal/contact values wired into the web app.
  - type: web
    name: vytal-api-production
    runtime: docker
    plan: standard
    region: singapore
    branch: production
    autoDeployTrigger: "off"
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # Migrate to head, then install/update the system starter library (idempotent,
    # production-safe). NEVER the demo seed — scripts.seed is refused in production.
    preDeployCommand: alembic upgrade head && python -m scripts.seed_library
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 30
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vytal-db-production
          property: connectionString
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: vytal-db-production
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: 60
      # Production origin(s) and host(s) — the real hostname is a launch input.
      - key: CORS_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      # Coach access stays invitation-only; the demo workspace is off in production.
      - key: COACH_REGISTRATION_CODE
        sync: false
      - key: DEMO_MODE_ENABLED
        value: false
      - key: SEED_DEMO_DATA
        value: false
      # Durable object storage (S3 / Cloudflare R2). Bucket/region/endpoint and the
      # boto3 credential pair are launch inputs; nothing is stored on disk.
      - key: MEDIA_STORAGE_PROVIDER
        value: s3
      - key: MEDIA_S3_BUCKET
        sync: false
      - key: MEDIA_S3_REGION
        sync: false
      - key: MEDIA_S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Transactional email (invitations + password reset).
      - key: EMAIL_PROVIDER
        value: smtp
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_SMTP_HOST
        sync: false
      - key: EMAIL_SMTP_PORT
        value: 587
      - key: EMAIL_SMTP_USERNAME
        sync: false
      - key: EMAIL_SMTP_PASSWORD
        sync: false
      - key: PASSWORD_RESET_TOKEN_MINUTES
        value: 60
      - key: LOG_LEVEL
        value: INFO
      - key: API_DOCS_ENABLED
        value: false
      - key: DATABASE_SSLMODE
        value: require
      - key: DATABASE_POOL_SIZE
        value: 10
      - key: DATABASE_MAX_OVERFLOW
        value: 10
      - key: DATABASE_POOL_TIMEOUT
        value: 30
      - key: DATABASE_POOL_RECYCLE
        value: 1800
      - key: DATABASE_CONNECT_TIMEOUT
        value: 5
      # The process runs as a single instance; the in-process rate limiter is correct
      # only while replica count is 1 (see docs/production-readiness.md). Do not scale
      # horizontally without a shared-store limiter.
      - key: PYTHONUNBUFFERED
        value: 1

databases:
  - name: fitness-intelligence-db-staging
    databaseName: fitness_staging
    user: fitness_staging
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []

  - name: vytal-db-production
    databaseName: vytal_production
    user: vytal_production
    plan: basic-1gb
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
